<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 3</title>
    <style>
        div{
            height: 70vh;
            display: grid;
            place-items: centre;
        }
    </style>
</head>
<body style="background-color: rgb(137, 12, 12); height: 100px;">
    <nav style="background-color: black; color: white; padding-left: 10%; height: 90px; ">
        <h1>First Northen Bank </h1> 
        <img src="bank.jpg" alt="bankimage" width="50" style="padding-left: 10px;">
    </nav>
    <header style="height: 10px;">
        <div style="background-color: white; margin: 0 10% 0 10%; padding: 4%;">
            <form>
                <h1>New User Registration</h1>
                <p>In order to use FNB's All Day Banking Servic, Please complete the following details and then the submit button to complete the Registration cycle</p>
                <table>
                    <tr>
                        <td><label>Last Name</label></td>
                        <td><input type="text" name="lname"/></td>
                    </tr>
                    <tr>
                        <td><label>First Name</label></td>
                        <td><input type="text" name="fname"/></td>
                    </tr>
                    <tr>
                        <td><label>Your prefered user id</label></td>
                        <td><input type="text" name="id"/></td>
                    </tr>
                    <tr>
                        <td><label>Email Address</label></td>
                        <td><input type="email" name="email"/></td>
                    </tr>
                    <tr>
                        <td><label>Account Number</label></td>
                        <td><input type="number" name="Ano"/></td>
                    </tr>
                    <tr>
                        <td><label>Credit card number</label></td>
                        <td><input type="number" name="ccno"/></td>
                    </tr>
                    <tr>
                        <td><label>Online Password</label></td>
                        <td><input type="password" name="opass"/></td>
                    </tr>
                    <tr>
                        <td><label>Online Password(repeted)</label></td>
                        <td><input type="password" name="opass"/></td>
                    </tr>
                    <tr>
                        <td><input type="submit" value="submit"/>
                            <input type="reset" value="clear"/></td>
                    </tr>
                </table>
            </form>
            </div>
    </header>
</body>
</html>
